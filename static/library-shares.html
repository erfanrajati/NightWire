<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <link rel="stylesheet" href="/library/assets/shell.css?v=1.0.2"><link rel="stylesheet" href="/library/assets/browser.css?v=1.0.2">

<body>
  <main class="shell library-browser-shell">
    <header class="topbar"><a class="brand" href="/library"><div class="brand-mark"><span></span><span></span><span></span></div><div><p class="eyebrow">PERSONAL CLOUD</p><h1>Library <span>Shares</span></h1></div></a><div class="account-actions"><a href="/library">My Library</a><a href="/workspaces">Workspace</a><button id="logoutButton" type="button">Sign out</button></div></header>
